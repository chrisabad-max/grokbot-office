# Publishes the Grok Bot wallpaper site to GitHub Pages on every push to main:
# https://bodila51.github.io/grokbot-wallpaper/        the landing page (landing/), with the live wallpaper in it
# https://bodila51.github.io/grokbot-wallpaper/face/   the wallpaper itself with its demo data (installed wallpapers
# point here and pick up every change by themselves). landing/assemble.mjs lists what goes out (no journal, keys or
# source art); the same tree is deployed to https://0xcodila.com/grokbot-wallpaper/, the landing's main address.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: node landing/assemble.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
