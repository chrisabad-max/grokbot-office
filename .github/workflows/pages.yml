# Publishes this fork of the Grok Bot office to GitHub Pages on every push to main:
# https://chrisabad-max.github.io/grokbot-office/
# landing/assemble.mjs builds _site/ (no journal, keys, or source art). The feed topic stays in the URL hash.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch: # re-run from the Actions tab without another code change
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: node landing/assemble.mjs _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
